name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
      with:
        use-policy-store: true
        api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: step-security/setup-ruby@21e04acd3bfc5f5f0aceb129c88a52ce4df996e2 # v1.329.0
      with:
        ruby-version: 3.4
        bundler-cache: true # 'bundle install' and cache
    - name: Run specs
      run: |
        bundle exec rubocop
